[package]
name = "bulwark_native"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "The few things the Bulwark desktop app can't do from JavaScript. See README.md."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# No default features: only Node-API as old as Electron's oldest, no tokio.
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"

[target.'cfg(windows)'.dependencies]
windows-future = "0.3"
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Data_Pdf",
  "Foundation",
  "Graphics_Printing",
  "Security_Credentials",
  "Security_Credentials_UI",
  "Security_Cryptography",
  "Security_Cryptography_Core",
  "Storage",
  "Storage_Streams",
  "Storage_Provider",
  "Storage_Search",
  "System",
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Imaging",
  "Win32_Graphics_Printing",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  "Win32_Storage_CloudFilters",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_Storage_Xps_Printing",
  "Win32_System_Com",
  "Win32_System_CorrelationVector",
  "Win32_System_DataExchange",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Pdf",
  "Win32_System_WinRT_Printing",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "UI",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# macos-12 for SecTrust::chain. Electron 45 needs macOS 12 anyway. The two crates after
# it are what security-framework itself is built on, for the calls it doesn't wrap.
security-framework = { version = "3", features = ["macos-12"] }
security-framework-sys = "2"
core-foundation = "0.10"
core-foundation-sys = "0.8"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
